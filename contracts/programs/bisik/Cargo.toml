[package]
name = "bisik"
version = "0.1.0"
description = "Bisik: private stake-backed builder sourcing market"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bisik"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
arcium-client = { default-features = false, version = "=0.15.0" }
arcium-macros = "=0.15.0"
arcium-anchor = "=0.15.0"
anchor-spl = { version = "1.0.2", default-features = false, features = ["token", "token_2022"] }
groth16-solana = "0.2.0"
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
