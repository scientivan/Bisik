<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#141414" />
    <meta
      name="description"

    <title>Bisik · Private signals</title>
    <link rel="icon" href="/mark.svg" />
    <link rel="preconnect" href="https://marketing.butter.video" crossorigin />

    <script>
      // Dark is the default. Only an explicit toggle (saved as bisik:theme-choice) switches to light.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("bisik:theme-choice") === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>

  </body>
