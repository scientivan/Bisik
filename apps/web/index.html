    <script>
      try {
        const t = localStorage.getItem("bisik:theme");
        document.documentElement.dataset.theme =
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
